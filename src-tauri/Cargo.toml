[package]
name = "lapeditor"
version = "0.1.0"
description = "Lightweight notepad with Monaco + TextMate language plugins"
authors = ["you"]
edition = "2021"

[lib]
name = "lapeditor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "7"
encoding_rs = "0.8"
base64 = "0.22"
